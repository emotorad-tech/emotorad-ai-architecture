# Labels for Jev calibration (scripts/calibrate_jev.py), beyond the retrieval
# goldens, which are imported from tests/test_retrieval_evals.py rather than copied.
# Standard-response examples and counter-examples are read from knowledge/_standard/.
#
# Fields: text, language (english | hindi | hinglish | marathi | tamil | other),
# category (battery | motor | none_of_these), sub_category (a knowledge record id,
# or none), error_code (e.g. E07, or none), needs_warranty_lookup (true/false),
# bike ({product_name: ...}, only where the record depends on the model).
#
# Omitted fields default to: sub_category none, error_code none,
# needs_warranty_lookup false. An explicit null means "not scored on this
# question" because the message genuinely does not settle it. Prefer null to a
# guess: a wrong label pulls a threshold the wrong way.
#
# DRAFT LABELS (2026-09-28): written to fill coverage gaps, not taken from real
# chats. An SME should review them before a calibration run is trusted. Never
# paste real customer messages here unedited: this repo is public.

# Corrections to the imported retrieval phrases, keyed by their exact text.
imported:
  "charger laga diya but nothing happens": {language: hinglish}
  "warranty mein replacement milega": {language: hinglish, needs_warranty_lookup: true}
  "battery replacement under warranty": {needs_warranty_lookup: true}

