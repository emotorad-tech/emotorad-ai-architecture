  # -- follow-ups: replies mid-conversation --------------------------------------
  # `current_sub_category` is the record the conversation is on; `history` is the
  # customer's earlier messages, oldest first. Calibration sends both, as the
  # runtime does, and also replays route() on each (calibration.evaluate_followups).
  #
  # STAY: sub_category equals current_sub_category. The reply continues the same
  # issue; Jev should not confidently name another category or record.
  # LEAVE: sub_category is another record, or none with a different category. The
  # customer has moved on; Jev should say so confidently.

