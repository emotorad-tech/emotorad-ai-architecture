id: battery-soc-indicator-dead
title: Battery works but the SOC indicator does not light
topic: battery
# The symptom is easy to mishear as "won't turn on". It is the opposite: the bike
# runs, the pack charges, and only the indicator is dead. Phrasings kept close to
# how customers say it.
symptoms: [indicator not working, soc button not working, light not coming on battery,
           no indication on battery, battery light not showing, indicator band dead,
           battery indicator kaam nahi kar raha, light nahi aa rahi button dabane par]
applies_to: {}
# A Doodle has no SOC button, so this fault cannot occur on one.
excludes: {product_name: doodle}
source: AFS battery hardware — SOC button / indicator fault
media:
  - id: afs/battery/photos/soc-button-non-doodle.png
    kind: image
    caption: The SOC button and charge indicator, on the side of the pack
steps:
  # This gate is step one because the record kept being applied to the wrong
  # fault. The precondition used to be stated as a description — "the bike runs,
  # the battery charges" — sitting next to a step phrased as an instruction, and
  # the instruction was the one that got executed. A customer whose bike would
  # not turn on at all was asked whether the indicator had ever lit, shown the
  # four-part evidence video that exists to prove a pack works, and told the bike
  # should still run. A condition written as prose does not gate anything.
  #
  # Retrieval cannot make this call. Both records legitimately own the words
  # "SOC button" and "no light" — a customer says the same sentence for either
  # fault, and the thing that separates them is whether the bike runs, which is
  # in the conversation and not in the query. So the gate lives here, where the
  # answer is known, rather than being something scoring is expected to settle.
  - >-
    GATE — ANSWER THIS BEFORE ANYTHING ELSE IN THIS RECORD. Does the bike still run? If
    you do not already know from what the customer has said, ask that and nothing else,
    and wait.
  - >-
    THE BIKE DOES NOT RUN, OR WILL NOT POWER ON — this is not the record. Stop here, take
    nothing from it, and go to battery-wont-power-on. Being handed this record by a search
    is not evidence that it applies: it matches on the words "SOC button" and "no light",
    which both faults are described with. A dark SOC on a bike that will not start means
    the pack has no charge to show, which is the won't-power-on flow; a dark SOC is only
    an indicator fault when everything else works.
  - >-
    THE BIKE RUNS AND THE PACK CHARGES, and only the indicator is dead — this is the
    record. Carry on below. Say the bike working is what makes this the indicator rather
    than the pack, so the customer understands why the questions changed.
  - >-
    Ask when it started and whether it ever worked. "It worked when I bought it and
    stopped last month" is a different case from "it never lit" — for the second, ask
    whether they are pressing and holding for one to two seconds, because a short tap does
    nothing and that is a two-message fix rather than a replacement.
  - >-
    Ask for ONE video showing four things in a single continuous take, listed in one
    message. One unbroken take matters more than four tidy clips: it is what shows the
    pack working while the indicator stays dark, which is the whole claim.
  - >-
    In that video, and give each part its reason rather than listing four chores: (1) the
    charger connected to the battery with the charger LED visible — the pack accepting
    charge; (2) the SOC button pressed and held for one to two seconds with the indicator
    staying dark — the fault itself; (3) the charger unplugged, visibly, on camera —
    without this nothing in the last part proves anything, because a bike with the charger
    still attached may be running on the charger rather than on the pack, and the pack
    delivering power is the whole claim; (4) the battery refitted to the bike and the bike
    switched on and running on it.
  - >-
    Do not put a question inside that list. "— does it run?" as the fourth item reads as
    something to answer rather than something to film, and a customer who answers it in
    words has not sent the one shot the claim rests on. Ask for four things to film. Ask
    questions afterwards, about what the video showed.
  - >-
    How it resolves is battery-warranty-replacement, and nothing about it depends on how
    far into the warranty they are. This record used to say under a year meant replacement
    and a year or more meant a paid service-centre repair. There is no such rule: inside
    the warranty a fault with no physical damage is put right free, at eleven months or at
    twenty-three, and whether that is a repair or a replacement is the service centre's
    call rather than a date's. Cost turns on physical damage and on the warranty having
    run out — not on age within it.
  - >-
    Say what date you are working from before you lean on it. Coverage here is usually
    measured from the registration date rather than the purchase date, because the
    purchase date is missing from most records — the customer context tells you which you
    have. On a case this close to the line, tell them the age you are using and that a
    colleague confirms it before anything is booked. Never announce a free replacement on
    a date you inferred.
escalate_when: >-
  Confirmed by the video — the remedy and who pays are battery-warranty-replacement. In
  warranty with no physical damage, free, whatever the age within the term. Physical
  damage or an expired warranty, chargeable. The video goes on the ticket either way.
