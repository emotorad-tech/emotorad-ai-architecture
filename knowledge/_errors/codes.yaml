# Display error codes, by model group.
#
# A code alone is not enough: the same code means different things on different
# bikes. E-30 carries a real diagnosis on a T-REX + V3 and is not supposed to be
# possible on any other TREX+, which is a different situation again — a code that
# cannot occur suggests the customer is misreading the display, and that wants a
# person rather than troubleshooting a fault that does not exist.
#
# Two audiences per row, deliberately:
#   customer_message  — what the bot says in chat. A customer cannot swap a
#                       display to test a theory, so this says what it means and
#                       what happens next.
#   technician_chain  — the ordered list of suspects, shown behind a "Technical
#                       breakdown" control and carried on the ticket. Written for
#                       whoever has the parts.
#
# `verification` is an evidence requirement expressed as data rather than prose —
# the thing that must be seen before the diagnosis holds.
#
# Anything not listed is unknown, and unknown means a person. Never infer a
# diagnosis from a neighbouring code.

# Matched against the OMS product name, which is messy: "X2 Furious Red V2 -
# EM02BV01C23", "Doodle V4 Indicator Edition", "STX 27.5 inch". Patterns are
# lowercase substrings, tried in order, so the most specific group must come
# first — a T-REX + V3 would otherwise match the plain TREX+ group.
model_groups:
  - id: trex_plus_v3
    label: T-REX + V3
    match: ["t-rex + v3", "trex+ v3", "trex + v3", "t-rex plus v3", "trex plus v3"]

  - id: x3_v1
    label: X3 V1
    match: ["x3 v1", "x3v1"]

  - id: standard
    label: X2, X1 LTD ED, LEGEND 007, T-REX AIR, STX, EMX, TREX+, Doodle (all), Ranger, Cargo
    match:
      ["x2", "x1 ltd", "legend 007", "t-rex air", "trex air", "stx", "emx",
       "trex+", "t-rex +", "trex plus",
       # Every Doodle — V1 through V4 and Pro — answers the same way, and OMS
       # often ships them with no version at all ("Doodle Black"), so matching
       # on the family name is both correct and the only thing that works.
       "doodle",
       "ranger", "cargo"]

codes:
  # --- standard group ------------------------------------------------------
  # E-01..E-05, E-13, E-30 are undocumented for these bikes. Undocumented is a
  # real answer and a safe one; it is not the same as "no fault".
  - code: [E-01, E-02, E-03, E-04, E-05, E-13, E-30]
    groups: [standard]
    disposition: human_support
    customer_message: >-
      That code needs a person to look at it — I do not have a documented cause for it on
      your model, and I would rather not guess. Let me get you to our support team.

  - code: E-06
    groups: [standard]
    disposition: diagnose
    customer_message: >-
      E-06 points at the charging port or the battery management system. The first thing
      to rule out is a melted port, which is visible in a photo.
    # States what must be seen and where the check lives. It used to restate the
    # whole procedure here — two photos, terminal first, controller either way —
    # which made this a second copy of battery-melted-terminal, and the copy is
    # what got followed: `lookup_error_code` runs first by §5b0, this read as
    # complete instructions, and search_knowledge was never called. The real
    # record carries the melted-versus-normal comparison pictures that go out
    # with each request; this field cannot, so a bot working from here asks a
    # customer to judge melting against nothing and stops after one photo.
    verification: >-
      Both ends seen and compared before either case holds — the battery terminal and the
      controller's battery connector, melted or not, whatever the first one shows. Do not
      run that check from this line: it is battery-melted-terminal, and only that record
      carries the melted-versus-normal comparison pictures and the order they go in.
      Search for it. Case 2 is only reachable once both photographs are in and neither
      end is melted.
    technician_chain: >-
      Case 1: port melted — visible on inspection. Case 2: BMS voltage dropping from
      string imbalance — E-06 persists on charging AND case 1 is ruled out.

  - code: E-07
    groups: [standard]
    disposition: diagnose
    customer_message: >-
      E-07 points at the motor. Confirming it means swapping in a known-good part, which
      needs a service centre.
    technician_chain: >-
      Motor first — replace with a working motor to confirm. If E-07 persists, controller
      and its connector. In rare cases a short circuit in the display.

  - code: E-08
    groups: [standard]
    disposition: diagnose
    customer_message: >-
      E-08 points at the throttle. Confirming it means swapping in a known-good part, which
      needs a service centre.
    technician_chain: >-
      Throttle first — replace with a working throttle to confirm. If E-08 persists,
      controller and its connector. In rare cases a short circuit in the display; rarest
      of all, the motor.

  - code: E-09
    groups: [standard]
    disposition: diagnose
    customer_message: >-
      E-09 is the controller. That is the one code here with a single cause, so there is no
      guesswork — it needs a service centre to replace it.
    technician_chain: Controller. Sole cause for this code.

  # E-10 and E-11 share a diagnosis; confirmed 2026-09-09.
  - code: [E-10, E-11]
    groups: [standard]
    disposition: diagnose
    customer_message: >-
      That code points at the display first. Confirming it means swapping in known-good
      parts one at a time, which needs a service centre.
    technician_chain: >-
      Display first — replace with a working display to confirm. If the code persists:
      harness, then controller, then motor. In the rarest case the PAS.

  # Unlike the others this is a conclusion, not a chain: the culprit is known.
  - code: E-12
    groups: [standard]
    disposition: diagnose
    customer_message: >-
      E-12 means the battery is faulty and needs replacing. It is not dead — that is why the
      bike still turns on — but it will most likely not run properly, or the power will come
      and go. A service centre will handle the replacement.
    technician_chain: >-
      Battery faulty, replacement required. Not a dead pack — the bike powers on — but
      expect it not to run, or to show voltage fluctuation under load. No elimination
      sequence needed; the battery is the cause.

  # --- T-REX + V3 ----------------------------------------------------------
  - code: [E24, E25]
    groups: [trex_plus_v3]
    disposition: diagnose
    customer_message: >-
      That code comes from either the throttle or the motor — sometimes both. It needs a
      service centre to tell which.
    technician_chain: Throttle or motor or both. Check each.

  - code: E30
    groups: [trex_plus_v3]
    disposition: diagnose
    customer_message: >-
      E30 points at the display first. Confirming it means swapping in known-good parts one
      at a time, which needs a service centre.
    technician_chain: >-
      Display first — replace with a working display to confirm. If the code persists:
      harness, then controller, then motor. In the rarest case the PAS.

  # --- X3 V1 ---------------------------------------------------------------
  # Permanent, and not a documentation gap: the X3 V1 is old enough that no code
  # on it can be read as meaning any one thing. Saying so is more useful than a
  # guess dressed up as a diagnosis.
  - code: ["*"]
    groups: [x3_v1]
    disposition: human_support
    customer_message: >-
      Your X3 V1 is one of our older models, and error codes on it cannot be pinned to a
      single cause from the code alone — I would only be guessing. A service centre can
      test it properly. Let me point you to the nearest one.
