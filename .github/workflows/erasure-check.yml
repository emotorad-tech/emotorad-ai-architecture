name: Erasure check (staging)

# Manual erasure (docs/superpowers/specs/2026-10-01-manual-erasure-design.md):
# a person reviews and deletes each request with erasure_admin. This run deletes
# nothing. It lists open requests by reference and age only, and is red when one
# is 25 days old or more, so GitHub emails the workflow's owner.
# GitHub runs a schedule only from the default branch: until this file is on
# main, start it by hand (Actions -> this workflow -> Run workflow).
on:
  schedule:
    - cron: "30 3 * * *"  # 09:00 India time
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-02e7dc2874e0fdacb

permissions:
  id-token: write  # OIDC role assumption, no stored AWS keys
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # A one-off container from the deployed image. No secret is in this
      # command: the job reads the config store through the instance role.
      # Its output comes back here (default log driver): references and ages
      # only.
      - name: Run the erasure check on the instance (via SSM)
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "erasure check" \
            --parameters commands="[
              \"set -e\",
              \"docker run --rm -e AWS_REGION=$AWS_REGION -e EMOTORAD_AI_SECRET_ID=/emotorad/stage/ai/app -e EMOTORAD_AI_MEDIA_BUCKET=emotorad-ai-stage-media emotorad-ai:stage python -m emotorad_ai.erasure_admin check\"
            ]" \
            --query 'Command.CommandId' --output text)

          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
            [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ] && break
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Err:StandardErrorContent}'

          [ "$STATUS" = "Success" ]
