<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amiigo Chat Tester</title>
<!-- A test page for the Amiigo app's support chat (docs/contracts/amiigo-support-chat.md),
     served by scripts/amiigo_local.py, which relays to the chat server with the
     token in the Authorization header, as the app does. Test numbers only. -->
<style>
:root {
  --bg: #F4F4F4; --surface: #FFFFFF; --ink: #171717; --muted: #666666; --border: #E6E6E6;
  --accent: #FF6B2B; --accent-ink: #FFFFFF; --bot: #F1F1F1; --rider: #171717; --rider-ink: #FFFFFF;
  --ok: #1E8E3E; --warn: #B26A00; --bad: #C62828; --notice: #FFF4EC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1113; --surface: #181B1F; --ink: #ECEDEE; --muted: #9BA1A6; --border: #2A2E33;
    --bot: #23272C; --rider: #ECEDEE; --rider-ink: #111; --notice: #2B2018;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.wrap { display: flex; gap: 16px; justify-content: center; padding: 16px; flex-wrap: wrap; }
.phone { width: 390px; max-width: 100%; height: 820px; max-height: calc(100vh - 32px); background: var(--surface);
  border: 1px solid var(--border); border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; }
.side { width: 380px; max-width: 100%; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
header .title { font-weight: 600; flex: 1; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: var(--ok); } .chip.bad { color: var(--bad); border-color: var(--bad); } .chip.warn { color: var(--warn); border-color: var(--warn); }
button { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 10px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
input, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; width: 100%; }
.row { display: flex; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }
.muted { color: var(--muted); font-size: 13px; }
#messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 16px; word-wrap: break-word; overflow-wrap: anywhere; }
.msg.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.rider { background: var(--rider); color: var(--rider-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.system { align-self: center; background: var(--notice); font-size: 13px; border-radius: 10px; text-align: center; }
.msg .meta { font-size: 11px; opacity: .65; margin-top: 4px; }
.msg img, .msg video { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
.msg .caption { font-size: 12px; opacity: .8; }
.msg ul { margin: 4px 0; padding-left: 18px; }
.typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 2px 6px; }
.err { align-self: center; color: var(--bad); font-size: 13px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.ticket { display: inline-block; margin-top: 6px; font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px dashed var(--accent); }
.escalated { margin-top: 6px; font-size: 12px; color: var(--warn); font-weight: 600; }
footer { border-top: 1px solid var(--border); padding: 10px; }
.pills { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.pending { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
#composer { display: flex; gap: 8px; align-items: flex-end; }
#text { resize: none; height: 40px; }
#chats { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
.chat-item { text-align: left; }
.chat-item .t { font-weight: 600; } .chat-item .s { font-size: 12px; color: var(--muted); }
#log { font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; height: 240px; overflow: auto; white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 8px; }
.in { color: var(--ok); } .out { color: var(--accent); }
@media (max-width: 820px) { .phone { height: 80vh; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="phone" aria-label="Chat">
    <header>
      <span class="title">EMotorad Support</span>
      <span id="state" class="chip">not connected</span>
    </header>
    <div id="messages" aria-live="polite"></div>
    <footer>
      <div class="pills">
        <button data-pill="battery">Battery</button>
        <button data-pill="motor">Motor</button>
        <button id="newChat">New chat</button>
      </div>
      <div id="pending" class="pending" hidden></div>
      <div id="composer">
        <label class="sr" style="display:none" for="text">Message</label>
        <button id="attach" title="Attach a photo or video">+</button>
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/3gpp" hidden>
        <textarea id="text" placeholder="Type a message"></textarea>
        <button id="send" class="primary" disabled>Send</button>
      </div>
    </footer>
  </section>

  <aside class="side">
    <div class="card">
      <h2>Sign in</h2>
      <div class="row"><input id="token" type="password" autocomplete="off" placeholder="Paste an Amiigo staging access token (v4.public...)"></div>
      <div class="row">
        <button id="connect" class="primary">Connect</button>
        <button id="disconnect" disabled>Disconnect</button>
        <button id="forget">Forget token</button>
      </div>
      <p id="tokenInfo" class="muted"></p>
      <p class="muted">Test numbers only. The token stays in this page and the local relay's memory; it is sent only to the chat server.</p>
    </div>
    <div class="card">
      <h2>Past chats</h2>
      <div class="row"><button id="loadChats">Load</button><button id="older" disabled>Older messages</button></div>
      <div id="chats" class="row" style="flex-direction:column;align-items:stretch"></div>
    </div>
    <div class="card">
      <h2>Delete my conversation data</h2>
      <div class="row">
        <button id="eraseStatus">Status</button>
        <button id="eraseAsk">Ask to delete</button>
        <button id="eraseCancel">Cancel</button>
      </div>
      <p id="eraseOut" class="muted"></p>
    </div>
    <div class="card">
      <h2>Frames <span id="target" class="muted" style="text-transform:none"></span></h2>
      <div id="log"></div>
    </div>
  </aside>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = {
  ws: null, ready: false, conversationId: null, olderCursor: null, lastId: null,
  pending: new Map(),          // client_message_id -> frame awaiting its reply
  shown: new Set(),            // message ids on screen
  attachment: null,            // {upload_id, name}
  ping: null, wantOpen: false, backoff: 1,
};

function uuid() { return crypto.randomUUID(); }
function log(dir, obj) {
  const line = document.createElement("div");
  line.className = dir === "in" ? "in" : "out";
  line.textContent = (dir === "in" ? "< " : "> ") + (typeof obj === "string" ? obj : JSON.stringify(obj));
  $("log").appendChild(line);
  $("log").scrollTop = $("log").scrollHeight;
}
function setState(text, kind) { $("state").textContent = text; $("state").className = "chip " + (kind || ""); }
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function render(text) {
  // The formatting the contract lists: **bold**, *italic*, `code`, bullets, numbered lines, line breaks.
  const lines = escapeHtml(text || "").split("\n");
  let html = "", inList = false;
  for (const raw of lines) {
    let line = raw.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/`(.+?)`/g, "<code>$1</code>");
    const bullet = line.match(/^\s*(?:-|\d+\.)\s+(.*)$/);
    if (bullet) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + bullet[1] + "</li>"; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    html += line + "<br>";
  }
  if (inList) html += "</ul>";
  return html.replace(/(<br>)+$/, "");
}
function time(iso) { try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }

function bubble(message, extra) {
  if (message.id && state.shown.has(message.id)) return null;
  const el = document.createElement("div");
  el.className = "msg " + (message.sender === "rider" ? "rider" : message.sender === "system" ? "system" : "bot");
  el.innerHTML = render(message.text || "");
  for (const a of message.attachments || []) {
    if (!a.url) { const p = document.createElement("div"); p.className = "caption"; p.textContent = a.kind === "video" ? "Video" : "Photo"; el.appendChild(p); continue; }
    const media = document.createElement(a.kind === "video" ? "video" : "img");
    media.src = a.url; if (a.kind === "video") { media.controls = true; if (a.poster) media.poster = a.poster; } else { media.alt = a.caption || "Photo"; }
    el.appendChild(media);
    if (a.caption) { const c = document.createElement("div"); c.className = "caption"; c.textContent = a.caption; el.appendChild(c); }
  }
  if (extra) el.appendChild(extra);
  if (message.sent_at) { const m = document.createElement("div"); m.className = "meta"; m.textContent = time(message.sent_at); el.appendChild(m); }
  if (message.id) { state.shown.add(message.id); el.dataset.id = message.id; state.lastId = message.id; }
  return el;
}
function show(el) { if (!el) return; $("messages").appendChild(el); $("messages").scrollTop = $("messages").scrollHeight; }
function note(text, cls) { const el = document.createElement("div"); el.className = cls || "err"; el.textContent = text; show(el); return el; }
let typingEl = null;
function typing(on, label) {
  if (typingEl) { typingEl.remove(); typingEl = null; }
  if (on) { typingEl = note(label === "looking_at_video" ? "Looking at your video..." : "Typing...", "typing"); }
}

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await res.json(); } catch (e) { /* no body */ }
  log("in", method + " " + path + " -> " + res.status + " " + (data ? JSON.stringify(data).slice(0, 400) : ""));
  return { status: res.status, data };
}

// --- socket ---------------------------------------------------------------
async function connect() {
  const token = $("token").value.trim();
  if (token) {
    const r = await api("POST", "/relay/token", { token });
    if (r.status !== 200) { $("tokenInfo").textContent = (r.data && r.data.detail) || "That token was not accepted."; return; }
    $("tokenInfo").textContent = "Token: " + (r.data.token_type || "unknown type") + (r.data.expires ? ", expires " + r.data.expires : "") + (r.data.phone_ends ? ", phone ending " + r.data.phone_ends : "");
  }
  state.wantOpen = true; open();
}
function open() {
  if (state.ws) return;
  setState("connecting...", "warn");
  const ws = new WebSocket("ws://" + location.host + "/relay/chat");
  state.ws = ws; state.ready = false;
  ws.onmessage = (event) => { log("in", event.data); let frame; try { frame = JSON.parse(event.data); } catch (e) { return; } onFrame(frame); };
  ws.onclose = (event) => {
    state.ws = null; state.ready = false; clearInterval(state.ping); typing(false);
    $("send").disabled = true; $("disconnect").disabled = true;
    const why = event.code + (event.reason ? " " + event.reason : "");
    log("in", "closed " + why);
    if (event.code === 4401) { setState("signed out: " + (event.reason || "4401"), "bad"); note("Closed 4401 (" + (event.reason || "") + "). Refresh the token with Amiigo and connect again."); state.wantOpen = false; return; }
    if (event.code === 1008) { setState("closed 1008", "bad"); note("Closed 1008 (" + event.reason + "): a bug in what the page sent."); state.wantOpen = false; return; }
    if (!state.wantOpen) { setState("not connected"); return; }
    setState("reconnecting (" + why + ")", "warn");
    setTimeout(open, Math.min(state.backoff, 30) * 1000); state.backoff = Math.min(state.backoff * 2, 30);
  };
}
function sendFrame(frame) { if (!state.ws || state.ws.readyState !== 1) return false; log("out", frame); state.ws.send(JSON.stringify(frame)); return true; }

async function onFrame(frame) {
  switch (frame.type) {
    case "ready":
      state.ready = true; state.backoff = 1; setState("ready", "ok");
      $("send").disabled = false; $("disconnect").disabled = false;
      clearInterval(state.ping); state.ping = setInterval(() => sendFrame({ type: "ping" }), 30000);
      await catchUp();
      for (const pending of state.pending.values()) sendFrame(pending);  // resend anything with no reply
      break;
    case "pong": break;
    case "bot_typing":
      if (frame.conversation_id === state.conversationId) typing(true, frame.state);
      break;
    case "ack": {
      const local = document.querySelector('[data-local="' + frame.client_message_id + '"]');
      if (local) local.remove();
      if (frame.conversation_id === state.conversationId) show(bubble(frame.message));
      break;
    }
    case "reply": {
      state.pending.delete(frame.in_reply_to);
      if (frame.conversation_id !== state.conversationId) break;
      typing(false);
      const extra = document.createElement("div");
      if (frame.ticket) { const t = document.createElement("div"); t.className = "ticket"; t.textContent = frame.ticket.reference + " (" + frame.ticket.status + ")"; extra.appendChild(t); }
      if (frame.escalated) { const e = document.createElement("div"); e.className = "escalated"; e.textContent = "Handed to our team: they will contact you."; extra.appendChild(e); }
      if ((frame.actions || []).length) {
        const box = document.createElement("div"); box.className = "actions";
        for (const action of frame.actions) {
          if (action.kind !== "request_location") continue;
          const b = document.createElement("button"); b.textContent = action.label || "Share my location";
          b.onclick = () => shareLocation(); box.appendChild(b);
        }
        extra.appendChild(box);
      }
      show(bubble(frame.message, extra));
      break;
    }
    case "ticket_update":
      if (frame.conversation_id === state.conversationId) show(bubble(frame.message));
      else note("A ticket closed in another chat: " + frame.ticket.reference, "muted");
      break;
    case "error":
      typing(false);
      if (frame.client_message_id) state.pending.delete(frame.client_message_id);
      note("Error: " + frame.detail);
      break;
  }
}

function sendMessage(extra) {
  const text = $("text").value.trim();
  if (!text && !state.attachment && !(extra && extra.pill) && !(extra && extra.location)) return;
  if (!state.conversationId) newChat();
  const frame = Object.assign({ type: "message", client_message_id: uuid(), conversation_id: state.conversationId, text }, extra || {});
  if (state.attachment) frame.attachments = [{ upload_id: state.attachment.upload_id }];
  state.pending.set(frame.client_message_id, frame);
  const local = document.createElement("div"); local.className = "msg rider"; local.dataset.local = frame.client_message_id;
  local.innerHTML = render(text || (frame.pill ? "[" + frame.pill + "]" : state.attachment ? "[" + state.attachment.name + "]" : "[location]"));
  const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = "sending"; local.appendChild(meta);
  show(local);
  sendFrame(frame);
  $("text").value = ""; clearAttachment();
}
function shareLocation() {
  if (!navigator.geolocation) { note("This browser cannot share a location."); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => sendMessage({ location: { latitude: +pos.coords.latitude.toFixed(5), longitude: +pos.coords.longitude.toFixed(5) } }),
    () => note("Location was not shared. Type your pincode instead."),
  );
}

// --- chats and history -----------------------------------------------------
function newChat() {
  state.conversationId = uuid(); state.olderCursor = null; state.lastId = null; state.shown.clear();
  $("messages").innerHTML = ""; $("older").disabled = true;
  note("New chat " + state.conversationId.slice(0, 8), "muted");
}
async function loadChats() {
  const r = await api("GET", "/amiigo/v1/conversations?limit=20");
  const box = $("chats"); box.innerHTML = "";
  if (r.status !== 200) { box.textContent = "Could not load chats (" + r.status + " " + ((r.data && r.data.detail) || "") + ")."; return; }
  if (!r.data.conversations.length) { box.textContent = "No past chats."; return; }
  for (const chat of r.data.conversations) {
    const b = document.createElement("button"); b.className = "chat-item";
    b.innerHTML = '<div class="t"></div><div class="s"></div>';
    b.querySelector(".t").textContent = chat.title;
    b.querySelector(".s").textContent = [chat.status, chat.ticket ? chat.ticket.reference + " " + chat.ticket.status : null,
      chat.message_count + " messages", chat.can_continue ? "can continue" : "start a new chat to continue"].filter(Boolean).join(" · ");
    b.onclick = () => openChat(chat.conversation_id, chat.can_continue);
    box.appendChild(b);
  }
}
async function openChat(id, canContinue) {
  state.conversationId = id; state.shown.clear(); state.lastId = null; $("messages").innerHTML = "";
  const r = await api("GET", "/amiigo/v1/conversations/" + id + "/messages?limit=50");
  if (r.status !== 200) { note("Could not load the chat (" + r.status + ")."); return; }
  for (const m of r.data.messages) show(bubble(m));
  state.olderCursor = r.data.older_cursor; $("older").disabled = !state.olderCursor;
  if (!canContinue) note("This chat is over 48 hours old: the bot starts afresh. Start a new chat to carry on.", "muted");
}
async function loadOlder() {
  if (!state.olderCursor) return;
  const r = await api("GET", "/amiigo/v1/conversations/" + state.conversationId + "/messages?limit=50&before=" + encodeURIComponent(state.olderCursor));
  if (r.status !== 200) return;
  const first = $("messages").firstChild;
  for (const m of r.data.messages) { const el = bubble(m); if (el) $("messages").insertBefore(el, first); }
  state.olderCursor = r.data.older_cursor; $("older").disabled = !state.olderCursor;
}
async function catchUp() {
  // After a reconnect: everything after the last message held; reload the
  // newest page when the id is unknown (contract, "Catching up").
  if (!state.conversationId || !state.lastId) return;
  let after = state.lastId;
  for (;;) {
    const r = await api("GET", "/amiigo/v1/conversations/" + state.conversationId + "/messages?limit=50&after=" + encodeURIComponent(after));
    if (r.status === 400) { await openChat(state.conversationId, true); return; }
    if (r.status !== 200) return;
    for (const m of r.data.messages) show(bubble(m));
    if (!r.data.more_after || !r.data.messages.length) return;
    after = r.data.messages[r.data.messages.length - 1].id;
  }
}

// --- uploads -----------------------------------------------------------------
function clearAttachment() { state.attachment = null; $("pending").hidden = true; $("file").value = ""; }
async function upload(file) {
  if (!state.conversationId) newChat();
  $("pending").hidden = false; $("pending").textContent = "Uploading " + file.name + "...";
  const r = await api("POST", "/amiigo/v1/uploads", { conversation_id: state.conversationId, mime_type: file.type, size_bytes: file.size });
  if (r.status !== 200 && r.status !== 201) { $("pending").textContent = "Upload refused: " + r.status + " " + ((r.data && r.data.detail) || ""); return; }
  try {
    const put = await fetch(r.data.url, { method: "PUT", headers: r.data.headers || {}, body: file });
    log("in", "PUT to S3 -> " + put.status);
    if (!put.ok) throw new Error("S3 answered " + put.status);
  } catch (e) {
    $("pending").textContent = "The PUT to S3 failed (" + e.message + "). Run the relay on port 8000, the origin the bucket allows."; return;
  }
  state.attachment = { upload_id: r.data.upload_id, name: file.name };
  $("pending").textContent = "Attached: " + file.name + " (sent with your next message)";
}

// --- deletion requests -------------------------------------------------------
async function erase(kind) {
  const path = kind === "ask" ? "/amiigo/v1/erasure-requests" : "/amiigo/v1/erasure-requests/" + kind;
  if (kind === "ask" && !confirm("Delete my conversation data? This only records the request; our team deletes within 30 days.")) return;
  const r = await api("POST", path, kind === "ask" ? { confirm: true, conversation_id: state.conversationId } : {});
  $("eraseOut").textContent = r.status + ": " + (r.data ? (r.data.text || JSON.stringify(r.data)) : "");
}

// --- wiring ---------------------------------------------------------------------
$("connect").onclick = connect;
$("disconnect").onclick = () => { state.wantOpen = false; if (state.ws) state.ws.close(1000); };
$("forget").onclick = async () => { $("token").value = ""; await api("DELETE", "/relay/token"); $("tokenInfo").textContent = "Token forgotten."; };
$("send").onclick = () => sendMessage();
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!$("send").disabled) sendMessage(); } });
document.querySelectorAll("[data-pill]").forEach((b) => (b.onclick = () => state.ready && sendMessage({ pill: b.dataset.pill })));
$("newChat").onclick = newChat;
$("attach").onclick = () => $("file").click();
$("file").onchange = () => $("file").files[0] && upload($("file").files[0]);
$("loadChats").onclick = loadChats;
$("older").onclick = loadOlder;
$("eraseStatus").onclick = () => erase("status");
$("eraseAsk").onclick = () => erase("ask");
$("eraseCancel").onclick = () => erase("cancel");
api("GET", "/relay/status").then((r) => { if (r.data) $("target").textContent = "· " + r.data.target; });
newChat();
</script>
</body>
</html>
