<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMotorad Support Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!--
  EMotorad aftersales chat — front-end prototype
  =================================================
  What this is:
    A static, framework-free HTML/CSS/JS build of the mobile chat UI mocked up
    in the design canvas. It reproduces the visual design (EMotorad brand
    colors/typeface, pulled from emotorad.com) and the interaction pattern:
    AI greeting -> free-text issue -> clarifying quick-replies -> evidence
    request -> attach video -> ticket confirmation -> free-text fallback.

  What this is NOT:
    It does not call any AI backend. The conversation is a hardcoded SCRIPT
    (see below) that advances on a timer/click, exactly mirroring the sample
    transcript from the prompt-tuning playground (battery on/off-switch case).
    It's meant as a pixel- and interaction-accurate starting point for real
    integration, not a working support bot.

  Wiring it to the real agent:
    Search this file for "INTEGRATION POINT" — those are the places that
    currently fake a response and need to call the real backend instead
    (send the user's message/attachment to your agent API, stream/await the
    reply, and call renderAiTurn(...) with what comes back instead of reading
    from SCRIPT). The state machine (pointer/typing/filled/extra), rendering,
    and all CSS can stay as-is; only the "what happens next" logic needs to
    change from "read the next scripted step" to "ask the real agent".
-->

<style>
  :root {
    --ink: #171717;
    --accent: #FF6B2B;
    --bubble-ai-bg: #F1F1F1;
    --muted: #666666;
    --border: #EFEFEF;
    --card-border: #EAEAEA;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: #E9E9E9; /* page backdrop behind the phone frame; remove when embedding in a real shell */
    font-family: 'Figtree', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* The frame was 390px wide inside 24px of padding: 438px of content on a
       412px phone, so the page scrolled sideways and the browser shrank
       everything to fit. */
    overflow-x: hidden;
  }

  a { color: var(--accent); }
  a:hover { color: #E85A1E; }

  /* Centers the phone-sized frame on desktop; on an actual phone this frame
     should just be 100vw/100vh with no outer padding. */
  .frame-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #app {
    width: 390px;
    height: 844px;
    max-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #FFFFFF;
    position: relative;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  }

  /* Header */
  .header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 12px 16px;
    border-bottom: 1px solid var(--border);
    background: #FFFFFF;
  }
  .avatar-badge {
    width: 36px; height: 36px; border-radius: 999px;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .avatar-badge.sm { width: 24px; height: 24px; }
  .header-title { font-weight: 700; font-size: 15px; color: var(--ink); letter-spacing: -0.2px; }
  .header-sub { display: flex; align-items: center; gap: 5px; }
  .status-dot { width: 6px; height: 6px; border-radius: 999px; background: #22C55E; display: inline-block; }
  .header-sub span.label { font-size: 12px; color: var(--muted); }
  .header-menu { margin-left: auto; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }

  .context-pill-row { flex: 0 0 auto; display: flex; justify-content: center; padding: 10px 0 2px 0; }
  .context-pill {
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: #F5F5F5; border-radius: 999px; padding: 5px 12px;
  }

  /* Message list */
  .chat-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 14px 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Wider bubbles wrap onto fewer lines, which is the cheapest scroll saving
     available: nothing gets smaller, there is just less of it. */
  /* The messages themselves, pushed to the bottom of the scroll area so a
     short conversation sits above the composer instead of floating at the top
     with a void beneath it.

     `margin-top: auto` on this wrapper rather than `justify-content: flex-end`
     on the scroller: that has a long-standing Chrome bug where the top of the
     content becomes unreachable once it overflows. */
  .chat-inner {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; }

  /* Guide photos and clips, lined up with the bubble above them. The text row
     is indented by the avatar column; without the same indent the image ran
     flush to the edge, about 32px further left, which is what looked wrong.

     Not centred, deliberately. Left is the assistant and right is the
     customer, and a centred image belongs to neither side — which matters more
     once the customer's own photos are in the thread too. */
  .media-row { padding-left: 32px; }
  .media-row.user { padding-left: 0; padding-right: 0; }
  /* Bigger than the 190px the desktop mockup used. These are diagnostic:
     somebody is holding their own battery up against one. Still tappable for
     the full-screen view. */
  .bubble-media { max-width: 240px; border-radius: 16px; display: block; cursor: zoom-in; }
  /* A control the bot offered under its reply, such as "Share my location".
     A chip, not a link: it does something on this page rather than leaving it. */
  .action-chip { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 4px 34px;
    padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--accent); color: var(--accent);
    background: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; user-select: none; }
  .action-chip:active { background: #FFF7F2; }
  .action-chip.is-used { opacity: 0.45; pointer-events: none; }

  /* A photo that has been picked and not yet sent. Sits between the chat and
     the composer, so what is about to go out is visible before it goes. */
  .pending-strip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-top: 1px solid var(--border); background: #FAFAFA;
  }
  .pending-strip[hidden] { display: none; }
  .pending-thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; cursor: zoom-in; flex: 0 0 auto; }
  .pending-label { flex: 1 1 auto; font-size: 13px; color: var(--muted); }
  .pending-remove {
    width: 32px; height: 32px; border-radius: 999px; border: none;
    background: #EDEDED; color: var(--ink); font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto;
  }
  /* A picked video, same strip as the photo. `object-fit: cover` so a
     portrait clip fills the square rather than sitting in letterbox bars. */
  .pending-video { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #232323; flex: 0 0 auto; }
  .pending-label .filename { display: block; color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  /* The PUT to S3 in progress. A 60 MB clip on mobile data takes a while,
     and with nothing moving on the screen that reads as a hang. */
  .progress-track { flex: 1 1 auto; height: 6px; border-radius: 999px; background: #E3E3E3; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.15s linear; }

  /* The choice attach offers: camera or gallery. A sheet in the page rather
     than the OS chooser, because what the OS shows for a file input varies by
     phone and some go straight to the file manager. */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.35);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet-backdrop[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 390px; background: #FFFFFF;
    border-radius: 18px 18px 0 0; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)) 12px;
  }
  .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: #DDDDDD; margin: 0 auto 10px auto; }
  .sheet-btn {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px 12px; border: none; background: transparent; border-radius: 12px;
    font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink); text-align: left; cursor: pointer;
  }
  .sheet-btn:active { background: #F5F5F5; }
  .sheet-cancel { color: var(--muted); font-weight: 500; justify-content: center; }
  .msg-row.ai { align-self: flex-start; }
  .msg-row.user { align-self: flex-end; }

  .bubble-text {
    padding: 9px 13px;
    font-size: 14.5px;
    line-height: 1.4;
    white-space: pre-line;
  }
  /* Lists the model wrote. `pre-line` already supplies the line breaks, so
     these only need the marker and the indent, not vertical margins. */
  .bubble-text ul, .bubble-text ol { margin: 4px 0; padding-left: 20px; }
  .bubble-text li { margin: 2px 0; }
  .bubble-text strong { font-weight: 700; }
  .bubble-text code {
    background: rgba(0,0,0,0.06); border-radius: 4px;
    padding: 1px 4px; font-size: 13px;
  }
  .bubble-ai { background: var(--bubble-ai-bg); color: var(--ink); border-radius: 4px 18px 18px 18px; }
  .bubble-user { background: var(--ink); color: #FFFFFF; border-radius: 18px 4px 18px 18px; }

  .bubble-list { background: var(--bubble-ai-bg); color: var(--ink); border-radius: 4px 18px 18px 18px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45; }
  .bubble-list .intro { white-space: pre-line; margin-bottom: 8px; }
  .bubble-list .items { display: flex; flex-direction: column; gap: 6px; padding-left: 2px; }
  .bubble-list .items .row { display: flex; gap: 8px; align-items: flex-start; }
  .bubble-list .items .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--ink); margin-top: 7px; flex: 0 0 auto; display: inline-block; }
  .bubble-list .outro { white-space: pre-line; margin-top: 8px; color: #555555; font-size: 13px; }

  .ticket-card {
    background: #FFFFFF; border: 1px solid var(--card-border); border-radius: 16px; padding: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .ticket-check { width: 26px; height: 26px; border-radius: 999px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; margin-top: 1px; }
  .ticket-title { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .ticket-body { font-size: 13.5px; line-height: 1.45; color: #555555; margin-top: 4px; }

  .video-card { width: 190px; border-radius: 16px; overflow: hidden; background: var(--ink); }
  .video-thumb { height: 104px; display: flex; align-items: center; justify-content: center; background: #232323; }
  .video-play { width: 38px; height: 38px; border-radius: 999px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .video-meta { padding: 9px 11px; }
  .video-filename { font-size: 12.5px; font-weight: 600; color: #FFFFFF; }
  .video-duration { font-size: 11px; color: #B5B5B5; margin-top: 1px; }

  .typing-row { display: flex; align-items: flex-end; gap: 8px; align-self: flex-start; }
  .typing-bubble { background: var(--bubble-ai-bg); border-radius: 4px 18px 18px 18px; padding: 13px 16px; display: flex; gap: 4px; align-items: center; }
  .typing-dot { width: 6px; height: 6px; border-radius: 999px; background: #9A9A9A; display: inline-block; animation: dcBounce 1.1s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dcBounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  /* Footer variants */
  .footer-suggestion { flex: 0 0 auto; padding: 0 16px 10px 16px; }
  .chip {
    display: inline-flex; align-items: center; min-height: 38px;
    border: 1.5px solid var(--ink); border-radius: 999px; padding: 8px 15px;
    font-size: 13px; font-weight: 600; color: var(--ink); background: #FFFFFF;
    cursor: pointer; user-select: none;
  }
  .chip:active { background: #F5F5F5; }

  .footer-chips { flex: 0 0 auto; padding: 0 16px 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip.lg { min-height: 40px; padding: 9px 16px; font-size: 13.5px; }

  .footer-attach { flex: 0 0 auto; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)) 16px; border-top: 1px solid var(--border); }
  .attach-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
    border: 1.5px solid var(--accent); border-radius: 999px; padding: 12px;
    font-size: 14px; font-weight: 700; color: var(--ink);
    cursor: pointer; user-select: none;
  }
  .attach-btn:active { background: #FFF7F2; }

  .footer-composer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    border-top: 1px solid var(--border); background: #FFFFFF;
  }
  .icon-btn { width: 44px; height: 44px; border-radius: 999px; background: #F1F1F1; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .composer-input {
    flex: 1 1 auto; min-width: 0; height: 44px; background: #F5F5F5; border: none; border-radius: 999px;
    padding: 0 16px; font-size: 14.5px; font-family: inherit; color: var(--ink); outline: none;
  }
  .composer-input::placeholder { color: #9A9A9A; }
  .send-btn { width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; cursor: pointer; }

  /* While the agent is answering. Dimmed and inert, but still on the screen and
     still holding focus: removing the focused element is what made Android
     close the keyboard and throw the layout around on every message. */
  .footer-composer.is-busy { opacity: 0.55; }
  .footer-composer.is-busy .send-btn,
  .footer-composer.is-busy .icon-btn { pointer-events: none; }

  .hidden { display: none !important; }

  /* Full-screen view of a guide photo. Outside the chat scroll in the markup,
     because render() replaces that region's innerHTML on every message and
     would otherwise destroy this mid-view. */
  .lightbox {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img, .lightbox video { max-width: 100%; max-height: 100%; border-radius: 8px; display: block; }
  .lightbox-close {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px;
    width: 40px; height: 40px; border-radius: 999px;
    background: rgba(255,255,255,0.14); color: #FFFFFF;
    border: none; font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* On a real phone the mockup frame is not a frame, it is the whole screen.
     `dvh` rather than `vh`: `vh` ignores the browser's own chrome, so the
     composer sat below the fold until the address bar scrolled away. */
  @media (max-width: 480px) {
    .frame-wrap { padding: 0; min-height: 0; display: block; }
    #app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-height: none;
      border-radius: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>

<div class="frame-wrap">
  <div id="app">

    <div class="header">
      <div class="avatar-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14H11L10 22L20 9H12L13 2Z" fill="var(--accent)"/></svg>
      </div>
      <div>
        <div class="header-title">EMotorad Assistant</div>
        <div class="header-sub"><span class="status-dot"></span><span class="label">AI &middot; Online</span></div>
      </div>
      <div class="header-menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="#171717"/><circle cx="12" cy="12" r="1.6" fill="#171717"/><circle cx="19" cy="12" r="1.6" fill="#171717"/></svg>
      </div>
    </div>

    <div class="context-pill-row" id="contextPillRow" hidden>
      <div class="context-pill" id="contextPill"></div>
    </div>

    <div class="context-pill-row" id="devCodeRow" hidden>
      <div class="context-pill" id="devCode" style="background:#FFF1E8;color:#B4470F"></div>
    </div>

    <div class="chat-scroll" id="chatScroll"></div>

    <div class="pending-strip" id="pendingStrip" hidden>
      <img class="pending-thumb" id="pendingThumb" alt="Photo ready to send, tap to enlarge" />
      <div class="pending-label">1 photo ready to send</div>
      <button class="pending-remove" id="pendingRemove" aria-label="Remove photo">&times;</button>
    </div>

    <!-- The video's PUT to S3, while it runs. Same fixed-markup rule as the
         photo strip: render() never touches this region. -->
    <div class="pending-strip" id="videoProgressStrip" hidden>
      <div class="pending-label">Uploading video&hellip;</div>
      <div class="progress-track"><div class="progress-fill" id="videoProgress"></div></div>
    </div>

    <div class="pending-strip" id="pendingVideoStrip" hidden>
      <video class="pending-video" id="pendingVideoThumb" muted playsinline preload="metadata"></video>
      <div class="pending-label"><span class="filename" id="pendingVideoName"></span>1 video ready to send</div>
      <button class="pending-remove" id="pendingVideoRemove" aria-label="Remove video">&times;</button>
    </div>

    <div id="footer"></div>

  </div>

  <!-- Deliberately a sibling of #app, not a child of .chat-scroll: render()
       rebuilds that region wholesale, so a lightbox inside it would vanish the
       moment the next message arrived. -->
  <!-- Outside #app so a re-render never replaces it mid-pick. `accept` limits
       the picker to images; leaving `capture` off means the phone offers the
       camera and the gallery rather than forcing the camera. -->
  <!-- Two inputs, one per choice. `capture` opens straight into the rear
       camera on Android and iOS; without it the same input opens the gallery
       or file picker. `image/*` rather than a mime list: a narrow list sent
       Android straight to the file manager. The OS asks for camera permission
       the first time the camera input fires; there is no way for a web page to
       request gallery access up front, the picker grants it implicitly. -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />
  <input type="file" id="galleryInput" accept="image/*" hidden />
  <!-- Video goes through S3, never inline: the page presigns, PUTs the clip
       with a progress bar, then sends the upload id. `capture` opens the
       camera to record; the same input accepts a clip from the gallery on
       phones that offer the choice. -->
  <input type="file" id="videoInput" accept="video/mp4,video/*" capture="environment" hidden />

  <div class="sheet-backdrop" id="attachSheet" hidden>
    <div class="sheet" role="dialog" aria-label="Attach a photo or video">
      <div class="sheet-handle"></div>
      <button class="sheet-btn" id="sheetCamera">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Take a photo
      </button>
      <button class="sheet-btn" id="sheetGallery">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Choose from gallery
      </button>
      <button class="sheet-btn" id="sheetVideo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        Record a video
      </button>
      <button class="sheet-btn sheet-cancel" id="sheetCancel">Cancel</button>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close photo">&times;</button>
    <img id="lightboxImg" alt="" />
  </div>
</div>

<script>
/* ============================================================
   SCRIPT — the hardcoded sample conversation.
   INTEGRATION POINT: replace this with real agent responses.
   Each "ai" turn is something the assistant says; each "user"
   turn is a point where the UI waits for the visitor to act
   (free text, a quick-reply chip, or an attachment).
   ============================================================ */
/* ============================================================
   LIVE. The four INTEGRATION POINTs the handoff doc lists are
   now real calls to POST /message on this same origin. The
   rendering functions and the state shape below are unchanged
   from the prototype, which is what that doc said would happen:
   only "what happens next" moved from reading a hardcoded
   SCRIPT to asking the agent.

   Still stubbed, deliberately: the attach button. Uploading
   needs somewhere to put the file and a decision about size and
   type limits, and MessageIn has no attachment field yet. Until
   then it sends a text note so the conversation can continue,
   and the agent's evidence gate will correctly refuse to
   conclude a fault on it.
   ============================================================ */
var OPENING = "Hi! I'm an AI assistant here to help with your EMotorad bike.\n\nWhat's going on?";

var state = {
  conversationId: null,  // assigned by the server on the first reply
  draft: "",
  busy: false,
  pendingPhoto: null,   // a picked photo, downscaled, waiting to be sent
  pendingVideo: null,   // {uploadId, name, size, previewUrl}: a clip already in S3, waiting to be sent
  videoProgress: null,  // 0-100 while the PUT to S3 runs, null otherwise
  turns: []              // {isUser, text} | {isUser:true, photo} | {isUser:true, video} | {isAi, attachments:[...]}
};

function esc(s) {
  var d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

/* The bubbles are `white-space: pre-line`, so every newline the model writes
   becomes vertical space, and it is generous with them. Three or more in a row
   become a single blank line: the paragraph break survives, the dead space
   does not. */
function collapseBlankLines(text) {
  return String(text == null ? "" : text).replace(/\n{3,}/g, "\n\n").trim();
}

/* The small slice of markdown the agent actually writes.

   It leans on emphasis and lists to make a diagnostic step scannable, and the
   page was escaping all of it, so a customer read "set it to **ON**" with the
   asterisks in place.

   Escape first, format second. The model's output never enters the DOM as raw
   HTML: by the time any tag is inserted here, every < > & in the original text
   is already an entity, so the only tags in the result are the ones this
   function put there.

   Links are deliberately absent. A rendered link from model output is a
   phishing surface, and the prompt already forbids the model typing links or
   filenames — guide media goes through send_guide_media, where code resolves
   the URL from a catalogue key. Rendering links here would quietly undo that.

   Headings and tables are absent for a duller reason: a chat bubble is not a
   document, and the agent does not write them. */
function renderMarkdown(text) {
  var out = esc(collapseBlankLines(text));

  // Inline code before emphasis, so asterisks inside a code span are left alone.
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  // Single asterisks only where they are not part of a bold run.
  out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");

  // Lists. Consecutive marker lines become one list; everything else is left
  // as it is, because the bubble is `white-space: pre-line` and already
  // renders the model's own line breaks.
  var lines = out.split("\n");
  var html = [];
  var buffer = [];
  var kind = null;

  function flush() {
    if (!buffer.length) return;
    html.push("<" + kind + ">" + buffer.join("") + "</" + kind + ">");
    buffer = [];
    kind = null;
  }

  lines.forEach(function (line) {
    var bullet = line.match(/^\s*[-*\u2022]\s+(.*)$/);
    var numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (bullet || numbered) {
      var want = bullet ? "ul" : "ol";
      if (kind && kind !== want) flush();
      kind = want;
      buffer.push("<li>" + (bullet ? bullet[1] : numbered[1]) + "</li>");
      return;
    }
    flush();
    html.push(line);
  });
  flush();

  return html.join("\n");
}

/* Full-screen photo. The customer is being asked to compare their battery
   terminal against a reference picture, and they cannot do that at 190px. */
function openLightbox(url) {
  if (!url) return;
  var box = document.getElementById("lightbox");
  document.getElementById("lightboxImg").src = url;
  box.hidden = false;
  // Stop the chat scrolling behind the overlay on touch.
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  var box = document.getElementById("lightbox");
  if (!box || box.hidden) return;
  box.hidden = true;
  document.getElementById("lightboxImg").src = "";
  document.body.style.overflow = "";
}

function aiAvatar(size) {
  return '<div class="avatar-badge' + (size === 'sm' ? ' sm' : '') + '">' +
    '<svg width="' + (size === 'sm' ? 12 : 18) + '" height="' + (size === 'sm' ? 12 : 18) + '" viewBox="0 0 24 24" fill="none">' +
    '<path d="M13 2L4 14H11L10 22L20 9H12L13 2Z" fill="var(--accent)"/></svg></div>';
}

function renderAiTurnHtml(turn) {
  var html = '<div class="msg-row ai">' + aiAvatar("sm") +
    '<div class="bubble-text bubble-ai">' + renderMarkdown(turn.text) + "</div></div>";
  // Controls the agent offered. The tool named the action; the page decides
  // what it does. Only kinds this page knows are rendered, so a new kind on
  // the server is invisible here rather than a broken button.
  (turn.actions || []).forEach(function (a) {
    if (a.kind === "request_location") {
      html += '<div class="msg-row ai"><div class="action-chip' + (turn.actionUsed ? " is-used" : "") +
        '" data-action="request_location">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
        esc(a.label || "Share my location") + "</div></div>";
    }
  });
  // Guide photos and clips the agent chose to send. It picks a catalogue key;
  // code resolves the URL, so nothing here is ever a link the model typed.
  (turn.attachments || []).forEach(function (a) {
    if (a.kind === "video") {
      html += '<div class="msg-row ai media-row"><div class="video-card"><video src="' + esc(a.url) +
        '" controls playsinline style="width:100%;display:block"></video></div></div>';
    } else {
      // data-full carries the URL so the tap handler does not have to parse it
      // back out of the src attribute.
      html += '<div class="msg-row ai media-row"><img class="bubble-media" data-full="' + esc(a.url) +
        '" src="' + esc(a.url) +
        '" alt="Guide photo, tap to enlarge" /></div>';
    }
  });
  return html;
}

function renderUserTurnHtml(turn) {
  if (turn.video) {
    // The local preview, not the S3 key: the bytes are already on the phone
    // and a presigned read would only be another round trip for the same clip.
    return '<div class="msg-row user media-row user"><div class="video-card"><video src="' + esc(turn.video.previewUrl) +
      '" controls muted playsinline preload="metadata" style="width:100%;display:block"></video>' +
      '<div class="video-meta"><div class="video-filename">' + esc(turn.video.name) +
      '</div><div class="video-duration">' + esc(formatSize(turn.video.size)) + ' &middot; video</div></div></div></div>';
  }
  if (turn.photo) {
    return '<div class="msg-row user media-row user"><img class="bubble-media" data-full="' + esc(turn.photo) +
      '" src="' + esc(turn.photo) +
      '" alt="Photo you sent, tap to enlarge" /></div>';
  }
  if (turn.attachment) {
    return '<div class="msg-row user"><div class="video-card"><div class="video-thumb"><div class="video-play">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5v14l11-7z"/></svg></div></div>' +
      '<div class="video-meta"><div class="video-filename">' + esc(turn.attachment.filename) +
      '</div><div class="video-duration">' + esc(turn.attachment.duration) + ' &middot; video</div></div></div></div>';
  }
  return '<div class="msg-row user"><div class="bubble-text bubble-user">' + esc(turn.text) + "</div></div>";
}

function render() {
  var scroll = document.getElementById("chatScroll");
  var html = "";
  state.turns.forEach(function (t) {
    html += t.isUser ? renderUserTurnHtml(t) : renderAiTurnHtml(t);
  });
  if (state.busy) {
    html += '<div class="typing-row">' + aiAvatar("sm") +
      '<div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>';
  }
  // Only the message list is rebuilt. The composer is never inside this.
  scroll.innerHTML = '<div class="chat-inner">' + html + "</div>";
  // Re-bound after every render, because the nodes they were on have just been
  // replaced. One listener on the scroll region would be tidier; this stays
  // closer to how the rest of the file already works.
  Array.prototype.forEach.call(scroll.querySelectorAll(".bubble-media"), function (img) {
    img.addEventListener("click", function () { openLightbox(img.getAttribute("data-full")); });
  });
  Array.prototype.forEach.call(scroll.querySelectorAll('[data-action="request_location"]'), function (chip) {
    chip.addEventListener("click", shareLocation);
  });
  pinToBottom();
  renderFooter();
}

/* "Share my location": one permission prompt, one position, one request. The
   coordinates go in the request body and nowhere else; the server turns them
   into a pincode and the transcript shows only that the location was shared.
   Every failure (no geolocation, permission refused, timeout) ends the same
   way: a local note to type the pincode, and the conversation carries on. */
function shareLocation() {
  if (state.busy) return;
  var fallback = "I couldn't get your location from the phone. Please type the pincode instead.";
  function markUsed() {
    for (var i = state.turns.length - 1; i >= 0; i--) {
      if (!state.turns[i].isUser && (state.turns[i].actions || []).length) { state.turns[i].actionUsed = true; break; }
    }
  }
  if (!navigator.geolocation) {
    state.turns.push({ isUser: false, text: fallback, attachments: [] });
    render();
    return;
  }
  navigator.geolocation.getCurrentPosition(function (pos) {
    markUsed();
    state.turns.push({ isUser: true, text: "Shared my location" });
    ask("", { latitude: pos.coords.latitude, longitude: pos.coords.longitude });
  }, function () {
    state.turns.push({ isUser: false, text: fallback, attachments: [] });
    render();
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

/* Keep the newest message against the composer. Called after every render and
   whenever the visual viewport changes, because the keyboard opening is a
   viewport change and otherwise leaves the last message scrolled out of
   sight. */
function pinToBottom() {
  var scroll = document.getElementById("chatScroll");
  if (scroll) scroll.scrollTop = scroll.scrollHeight;
}

/* Built once and then left alone.

   It used to be emptied whenever the agent was answering. That removed the
   focused <input> from the document, so Android closed the keyboard, the
   viewport resized, and when the reply arrived the composer was rebuilt and
   focused — opening the keyboard and resizing again. Two resizes per message,
   which is the lurch reported from a phone on 20 September.

   Now the only thing that changes while busy is a class and the send button's
   colour. Nothing is added to or removed from the document, so the keyboard
   never notices. */
function renderFooter() {
  var footer = document.getElementById("footer");
  if (footer.firstChild) { composerDisabled(state.busy); return; }
  var sendBg = state.draft.trim().length > 0 ? "var(--accent)" : "#D9D9D9";
  footer.innerHTML = '<div class="footer-composer">' +
    '<div class="icon-btn" id="attachBtn" title="Attach"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>' +
    '<input type="text" class="composer-input" id="draftInput" placeholder="Type your message..." value="' + esc(state.draft) + '" />' +
    '<div class="send-btn" id="sendBtn" style="background:' + sendBg + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></div>' +
    "</div>";
  var input = document.getElementById("draftInput");
  // Do NOT re-render on input. Rebuilding the composer recreates the <input>,
  // which resets the caret to position 0, so every character typed lands before
  // the previous one and the text comes out reversed. Only the send button
  // changes as you type, so change only the send button.
  input.addEventListener("input", function (e) {
    state.draft = e.target.value;
    paintSendButton();
  });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
  document.getElementById("sendBtn").addEventListener("click", send);
  document.getElementById("attachBtn").addEventListener("click", openAttachSheet);
  // Deliberately no focus() here. renderFooter runs on every message, and
  // focusing on a message the customer is reading reopens the keyboard under
  // their thumb. Focus follows what they tap; the input is no longer destroyed,
  // so it keeps focus on its own.
  composerDisabled(state.busy);
}

function paintSendButton() {
  var btn = document.getElementById("sendBtn");
  if (!btn) return;
  var ready = !state.busy && (state.draft.trim().length > 0 || !!state.pendingPhoto || !!state.pendingVideo);
  btn.style.background = ready ? "var(--accent)" : "#D9D9D9";
}

/* Dim and deaden the composer without touching the document's structure. The
   input keeps its value, its caret and its focus. */
function composerDisabled(busy) {
  var composer = document.querySelector(".footer-composer");
  var input = document.getElementById("draftInput");
  if (!composer || !input) return;
  composer.className = "footer-composer" + (busy ? " is-busy" : "");
  // readOnly, not disabled: a disabled input is blurred by the browser, which
  // would close the keyboard — the very thing this is here to avoid.
  input.readOnly = !!busy;
  // Only when it actually differs. Assigning to value moves the caret to the
  // end even when the string is identical, and a caret that jumps while
  // someone is typing is how the reversed-typing bug worked.
  if (input.value !== state.draft) input.value = state.draft;
  paintSendButton();
}

/* The one real integration: ask the agent, render what comes back. `location`
   is set only by shareLocation; it is sent once and not kept anywhere. */
function ask(text, location) {
  state.busy = true;
  render();
  // Cleared here rather than in the response handler: it has already been put
  // in the request body and shown in the transcript, and leaving it set would
  // attach the same photo to the next message too.
  var sentPhoto = state.pendingPhoto;
  var sentVideo = state.pendingVideo;
  state.pendingPhoto = null;
  state.pendingVideo = null;
  renderPendingStrip();
  // Both shapes on the one field; the API accepts a mixed list. The photo is
  // inline as before; the video is the id of an object already PUT to S3.
  var attachments = sentPhoto ? [{ kind: "image", url: sentPhoto }] : [];
  if (sentVideo) attachments.push({ upload_id: sentVideo.uploadId });
  // The server describes the clip through a video model before the agent
  // sees it, which can take a minute on a long recording. A typing dot for
  // that long reads as a hang, so say what is happening; the notice is
  // taken down when the reply (or the failure) arrives.
  var waitingNotice = null;
  if (sentVideo) {
    waitingNotice = { isUser: false, text: "Looking at your video. This can take a minute or two.", attachments: [] };
    state.turns.push(waitingNotice);
    render();
  }
  function dropWaitingNotice() {
    if (!waitingNotice) return;
    var at = state.turns.indexOf(waitingNotice);
    if (at !== -1) state.turns.splice(at, 1);
    waitingNotice = null;
  }
  fetch("/message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      conversation_id: state.conversationId,
      em_aid: emAid(),
      agent: "battery_support",
      text: text,
      attachments: attachments,
      location: location || null
    })
  }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (reply) {
    dropWaitingNotice();
    state.conversationId = reply.conversation_id;
    state.busy = false;
    state.turns.push({ isUser: false, text: reply.text, attachments: reply.attachments || [], actions: reply.actions || [] });
    render();
    pollDevCode();
  }).catch(function (err) {
    // Say what happened rather than leaving a spinner running. A chat that
    // silently stops is indistinguishable from one that is still thinking.
    dropWaitingNotice();
    state.busy = false;
    state.turns.push({
      isUser: false,
      text: "Sorry, I could not reach support just then (" + err.message +
            "). Please try again in a moment.",
      attachments: []
    });
    render();
  });
}

function send() {
  if (state.busy) return;
  var text = (state.draft || "").trim();
  if (!text && !state.pendingPhoto && !state.pendingVideo) return;
  if (state.pendingPhoto) state.turns.push({ isUser: true, photo: state.pendingPhoto });
  if (state.pendingVideo) state.turns.push({ isUser: true, video: state.pendingVideo });
  if (text) state.turns.push({ isUser: true, text: text });
  state.draft = "";
  ask(text);
}

/* A phone camera produces 3-6MB at 4000px wide. The model does not need that,
   the network does not want it, and the endpoint refuses over 4MB. Drawing it
   onto a canvas at 1280px on the long edge and re-encoding as JPEG gets a
   typical photo to around 200KB with the terminal still clearly readable.

   Done here rather than server-side so the big version never leaves the phone. */
var MAX_EDGE = 1280;

function shrinkToDataUri(file, done) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      try {
        done(canvas.toDataURL("image/jpeg", 0.8));
      } catch (e) {
        // A canvas the browser considers tainted, or one too large to encode.
        done(null);
      }
    };
    img.onerror = function () { done(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { done(null); };
  reader.readAsDataURL(file);
}

function onPhotoPicked(event) {
  var file = event.target.files && event.target.files[0];
  // Clear it now, so picking the same file twice in a row still fires change.
  event.target.value = "";
  if (!file) return;
  shrinkToDataUri(file, function (dataUri) {
    if (!dataUri) {
      state.turns.push({
        isUser: false,
        text: "Sorry, I could not read that photo. Could you try taking it again?",
        attachments: []
      });
      render();
      return;
    }
    state.pendingPhoto = dataUri;
    renderPendingStrip();
    paintSendButton();
  });
}

/* Video never goes inline. A clip is 20-100 MB and the model does not read
   video anyway: the server describes it once through a video model and hands
   the text to the agent. So the page asks POST /uploads for a presigned PUT,
   sends the bytes straight to S3 with a progress bar, and attaches only the
   upload id to the message. The 100 MB cap mirrors the bucket's; refusing it
   here saves a presign that would only come back 413.

   INTEGRATION POINT (done): the same identity as /message. The page carries
   no session token; the cookie (`em_aid`) resolves the visitor's anonymous
   cluster, and the conversation id is minted here if the customer attaches
   before their first message has ever been sent. */
var MAX_VIDEO_BYTES = 100 * 1024 * 1024;

function conversationId() {
  if (!state.conversationId) {
    state.conversationId = "c-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
  return state.conversationId;
}

function notice(text) {
  state.turns.push({ isUser: false, text: text, attachments: [] });
  render();
}

function formatSize(bytes) {
  if (!bytes) return "";
  if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  return Math.max(1, Math.round(bytes / 1024)) + " KB";
}

function onVideoPicked(event) {
  var file = event.target.files && event.target.files[0];
  // Clear it now, so picking the same file twice in a row still fires change.
  event.target.value = "";
  if (!file) return;
  if (file.size > MAX_VIDEO_BYTES) {
    notice("That video is too large. Please send a clip under 100 MB or a shorter recording.");
    return;
  }
  if (state.videoProgress !== null) return;  // one at a time
  state.videoProgress = 0;
  renderPendingStrip();

  function failed(err) {
    state.videoProgress = null;
    state.pendingVideo = null;
    renderPendingStrip();
    paintSendButton();
    // A 415 is the file, not the network: retrying the same clip cannot help.
    if (err && err.status === 415) {
      notice("That format is not supported, please send an MP4 or a clip recorded on your phone camera.");
      return;
    }
    notice("Sorry, the video did not upload. Please try again.");
  }

  fetch("/uploads", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      conversation_id: conversationId(),
      em_aid: emAid(),
      tree: "customers",
      mime_type: file.type || "video/mp4",
      size_bytes: file.size
    })
  }).then(function (r) {
    if (!r.ok) {
      var err = new Error("HTTP " + r.status);
      err.status = r.status;
      throw err;
    }
    return r.json();
  }).then(function (presign) {
    putToS3(file, presign, function (ok) {
      if (!ok) { failed(); return; }
      state.videoProgress = null;
      state.pendingVideo = {
        uploadId: presign.upload_id,
        name: file.name || "video.mp4",
        size: file.size,
        previewUrl: URL.createObjectURL(file)
      };
      renderPendingStrip();
      paintSendButton();
    });
  }).catch(failed);
}

/* XMLHttpRequest rather than fetch: fetch has no upload progress event, and
   the bar is the whole point of not just awaiting the PUT. */
function putToS3(file, presign, done) {
  var xhr = new XMLHttpRequest();
  xhr.open("PUT", presign.url, true);
  Object.keys(presign.headers || {}).forEach(function (name) {
    // The browser sets Content-Length itself and refuses it from a script.
    if (name.toLowerCase() === "content-length") return;
    xhr.setRequestHeader(name, presign.headers[name]);
  });
  xhr.upload.onprogress = function (e) {
    if (!e.lengthComputable) return;
    state.videoProgress = Math.round((e.loaded / e.total) * 100);
    renderPendingStrip();
  };
  xhr.onload = function () { done(xhr.status >= 200 && xhr.status < 300); };
  xhr.onerror = function () { done(false); };
  xhr.onabort = function () { done(false); };
  xhr.send(file);
}

/* What is about to be sent, shown before it goes. The strips are fixed markup
   between the chat and the composer, so render() never rebuilds them and a
   photo or clip does not vanish from view when the next message arrives. */
function renderPendingStrip() {
  var strip = document.getElementById("pendingStrip");
  var thumb = document.getElementById("pendingThumb");
  if (!strip || !thumb) return;
  if (state.pendingPhoto) {
    thumb.src = state.pendingPhoto;
    strip.hidden = false;
  } else {
    thumb.src = "";
    strip.hidden = true;
  }

  var progressStrip = document.getElementById("videoProgressStrip");
  var progress = document.getElementById("videoProgress");
  if (progressStrip && progress) {
    progressStrip.hidden = state.videoProgress === null;
    progress.style.width = (state.videoProgress || 0) + "%";
  }

  var videoStrip = document.getElementById("pendingVideoStrip");
  var videoThumb = document.getElementById("pendingVideoThumb");
  var videoName = document.getElementById("pendingVideoName");
  if (videoStrip && videoThumb && videoName) {
    if (state.pendingVideo) {
      if (videoThumb.src !== state.pendingVideo.previewUrl) videoThumb.src = state.pendingVideo.previewUrl;
      videoName.textContent = state.pendingVideo.name;
      videoStrip.hidden = false;
    } else {
      videoThumb.removeAttribute("src");
      videoName.textContent = "";
      videoStrip.hidden = true;
    }
  }
  pinToBottom();
}

function removePendingPhoto() {
  state.pendingPhoto = null;
  renderPendingStrip();
  paintSendButton();
}

function removePendingVideo() {
  // The object is already in S3 under an id nobody will claim; it expires
  // with the pending entry. Only the local preview is released here.
  if (state.pendingVideo && state.pendingVideo.previewUrl) URL.revokeObjectURL(state.pendingVideo.previewUrl);
  state.pendingVideo = null;
  renderPendingStrip();
  paintSendButton();
}

function openAttachSheet() {
  if (state.busy) return;
  document.getElementById("attachSheet").hidden = false;
}

function closeAttachSheet() {
  document.getElementById("attachSheet").hidden = true;
}

/* Reading the verification code off the screen, because no SMS provider is
   wired: the code is generated locally and the playground shows it in its
   sidebar. Same idea, different surface. The endpoint 404s unless the server
   was started with EMOTORAD_AI_DEV_CODES=1, so this quietly shows nothing in
   any deployment that has not deliberately opted in. */
function pollDevCode() {
  if (!state.conversationId) return;
  fetch("/dev/verification/" + encodeURIComponent(state.conversationId))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var row = document.getElementById("devCodeRow");
      var el = document.getElementById("devCode");
      if (!row || !el) return;
      if (d && d.pending_code) {
        el.textContent = "Testing only \u00b7 code " + d.pending_code +
                         " \u00b7 " + d.attempts_left + " attempts left";
        row.hidden = false;
      } else if (d && d.verified_phone) {
        el.textContent = "Verified \u00b7 " + d.verified_phone;
        row.hidden = false;
      } else {
        row.hidden = true;
      }
    })
    .catch(function () { /* endpoint disabled: nothing to show */ });
}

/* The first-party cookie every visitor carries, logged in or not. Anonymous is
   a valid identity: it gets generic help, and nothing personal until a phone is
   verified in the conversation itself. */
function emAid() {
  var key = "em_aid";
  var v = null;
  try { v = window.localStorage.getItem(key); } catch (e) { /* private window */ }
  if (!v) {
    v = "em-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { window.localStorage.setItem(key, v); } catch (e) { /* not fatal */ }
  }
  return v;
}

/* Open the conversation. The greeting is local so the window is never blank;
   everything after it comes from the agent. */
/* The keyboard and the layout.

   `100dvh` accounts for the browser's own chrome, not the virtual keyboard, so
   when the keyboard opened the app kept its full height and the browser
   scrolled the page to reveal the input — taking the header off the top of the
   screen and clipping the message above it.

   `window.visualViewport` is the one that does shrink for the keyboard. Sizing
   the app from it means the whole chat sits above the keyboard instead of
   behind it. The CSS keeps `100dvh` as the fallback for anything without this
   API, so nothing regresses if it is missing. */
function fitToViewport() {
  var vv = window.visualViewport;
  var app = document.getElementById("app");
  if (!vv || !app || window.innerWidth > 480) return;
  app.style.height = vv.height + "px";
  // The keyboard appearing is a viewport change like any other, and without
  // this the newest message is left scrolled out of sight behind it.
  pinToBottom();
}

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitToViewport);
  window.visualViewport.addEventListener("scroll", fitToViewport);
}
window.addEventListener("orientationchange", fitToViewport);

document.getElementById("cameraInput").addEventListener("change", onPhotoPicked);
document.getElementById("galleryInput").addEventListener("change", onPhotoPicked);
document.getElementById("sheetCamera").addEventListener("click", function () {
  closeAttachSheet();
  document.getElementById("cameraInput").click();
});
document.getElementById("sheetGallery").addEventListener("click", function () {
  closeAttachSheet();
  document.getElementById("galleryInput").click();
});
document.getElementById("videoInput").addEventListener("change", onVideoPicked);
document.getElementById("sheetVideo").addEventListener("click", function () {
  closeAttachSheet();
  document.getElementById("videoInput").click();
});
document.getElementById("sheetCancel").addEventListener("click", closeAttachSheet);
document.getElementById("attachSheet").addEventListener("click", function (e) {
  if (e.target.id === "attachSheet") closeAttachSheet();
});
document.getElementById("pendingRemove").addEventListener("click", removePendingPhoto);
document.getElementById("pendingVideoRemove").addEventListener("click", removePendingVideo);
document.getElementById("pendingThumb").addEventListener("click", function () {
  openLightbox(state.pendingPhoto);
});
document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lightbox").addEventListener("click", function (e) {
  // Tapping the backdrop closes; tapping the photo itself does not.
  if (e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeLightbox(); closeAttachSheet(); }
});

state.turns.push({ isUser: false, text: OPENING, attachments: [] });
render();
fitToViewport();
</script>
